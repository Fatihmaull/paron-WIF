name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci --no-audit --no-fund
      - run: ./scripts/verify-all.sh
